  source_repository: "https://github.com/StackStorm-Exchange/stackstorm-kafka"
  source_version: "2.0.0"
  source_revision: "42ec262777308d655262e5b64029c655825eb98a"
  license: "Apache-2.0"

tags: [kafka, messaging, streaming, integration]
