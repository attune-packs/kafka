ref: kafka
label: "Apache Kafka"
description: "Safe Kafka publishing, metadata inspection, and managed consumption"
version: "0.1.0"
author: "Attune"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
